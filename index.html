<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Companion</title>
<meta name="description" content="A personal AI companion you can talk to and play games with, on any device.">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Companion">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div id="app" class="app">

  <!-- ============ Sidebar / navigation ============ -->
  <nav class="nav" id="nav">
    <div class="nav__brand">
      <img src="assets/icons/icon.svg" alt="" class="nav__logo" width="28" height="28">
      <span class="nav__name" id="brandName">Companion</span>
    </div>

    <div class="nav__tabs" role="tablist">
      <button class="tab" data-route="talk" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.5 9.5 0 0 1-2.8-.4L4 21l1.5-4.2A8.3 8.3 0 0 1 3 11.5a8.4 8.4 0 0 1 9-8.4 8.4 8.4 0 0 1 9 8.4Z"/></svg>
        <span>Talk</span>
      </button>
      <button class="tab" data-route="voice" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span>Voice</span>
      </button>
      <button class="tab" data-route="play" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><rect x="2" y="6" width="20" height="12" rx="4"/></svg>
        <span>Play</span>
      </button>
      <button class="tab" data-route="you" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
        <span>You</span>
      </button>
    </div>

    <div class="nav__threads" id="threadPane">
      <div class="nav__threadsHead">
        <span>Chats</span>
        <button class="iconbtn" id="newChatBtn" title="New chat" aria-label="New chat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <ul class="threads" id="threadList"></ul>
    </div>
  </nav>

  <!-- ============ Main ============ -->
  <main class="main" id="main">
    <header class="topbar">
      <button class="iconbtn topbar__menu" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1 class="topbar__title" id="viewTitle">Talk</h1>
      <div class="topbar__actions" id="topbarActions"></div>
    </header>

    <div class="view" id="view"></div>
  </main>

  <div class="scrim" id="scrim" hidden></div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
