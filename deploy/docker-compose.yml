# Companion on a Synology NAS.
#
#   docker compose up -d      (or Container Manager -> Project -> Create)
#
# Then open http://<nas-ip>:8080 and, under You -> Voice, set the Piper server
# to /tts — the app and Piper are served from the same origin, so that is all
# it needs.
#
# Run ./download-voices.sh first, or the Piper container will restart in a loop
# waiting for a model that is not there.

services:
  piper:
    build: ./piper
    image: companion-piper:1.7.0
    container_name: companion-piper
    restart: unless-stopped
    environment:
      # Must match a file in ./voices. Medium is the sweet spot on a J3455;
      # switch to a "low" voice if replies feel slow.
      PIPER_VOICE: en_US-amy-medium
    volumes:
      - ./voices:/voices:ro
    # A DS418+ ships with 2 GB. Piper holds one model in memory per voice used,
    # so cap it rather than let a burst push DSM into swap.
    mem_limit: 1g
    cpus: 3.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/voices"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    # Not published on the host: only nginx needs to reach it.
    expose:
      - "5000"

  web:
    image: nginx:1.27-alpine
    container_name: companion-web
    restart: unless-stopped
    depends_on:
      - piper
    ports:
      - "8080:80"
    volumes:
      # The site itself — the repository root, one level up from this file.
      - ../:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
