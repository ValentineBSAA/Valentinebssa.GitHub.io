# Piper only, for when Web Station is serving the site.
#
# Web Station has the app on port 80; this puts the voice on another port. That
# makes speech a cross-origin request, so unlike the all-in-one stack the CORS
# headers here are load-bearing rather than optional — Piper's own Flask server
# sends none, and the browser would refuse every request without them.

server {
    listen 80;
    server_name _;

    # A bare visit, so it is obvious the container is alive.
    location = / {
        default_type text/plain;
        return 200 "Companion voice server. Point the app at this address + /tts\n";
    }

    # Same /tts prefix as the all-in-one stack, so the setting reads the same
    # either way. The trailing slash on proxy_pass strips /tts before Piper
    # sees it, which matters — Piper serves /voices and /synthesize at its root.
    location /tts/ {
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_buffering off;

        # Echo the requesting origin. A wildcard would work too, but this keeps
        # the door open only to whoever actually asked.
        add_header Access-Control-Allow-Origin  $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Vary Origin always;

        # The app POSTs JSON, which browsers preflight.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://piper:5000/;
    }
}
