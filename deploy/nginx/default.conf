# Serves the site and puts Piper on the same origin at /tts.
#
# Same-origin is the point: the browser then treats speech requests as ordinary
# same-site fetches, with no CORS preflight to satisfy. The CORS headers further
# down only matter if you also open the app from GitHub Pages and point it at
# this NAS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Note: do NOT add a `types { ... }` block here. A types block in a server
    # replaces the inherited mime.types map wholesale rather than adding to it,
    # which silently serves .html and .js as text/plain — and a browser will not
    # execute a module script with that type. The .vrm type is set with
    # default_type in its own location further down instead.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed-forever assets do not exist here, so keep it modest: the service
    # worker handles offline, and a short cache keeps updates arriving.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location ~* \.(png|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # A character model is tens of megabytes and never changes once chosen.
    location ~* \.vrm$ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=604800";
    }

    # The service worker must never be cached, or updates never land.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # nginx's mime.types has no entry for .webmanifest, and some browsers want
    # the right type before they will offer to install the app.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # ---- Piper ----
    location /tts/ {
        # Synthesis on a J3455 is not instant. A long sentence at "high" quality
        # can take a while, so give it room before giving up.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Audio is returned whole, so buffering just adds latency.
        proxy_buffering off;

        # Piper labels its WAV bytes as text/html. The app decodes an
        # ArrayBuffer and never inspects the type, so this is harmless; fixing
        # it would mean splitting this into per-endpoint locations for no real
        # gain.

        # Only needed when the page itself is served from somewhere else
        # (e.g. GitHub Pages) and calls back to this NAS.
        add_header Access-Control-Allow-Origin  $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Vary Origin always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://piper:5000/;
    }
}
